<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classical Button Problem</title>
    <style>
      body {
        height: 100%;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      button {
        background-color: #000;
        padding: 10px 50px;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <button id="orange">Orange</button>
      <button id="green">Green</button>
    </div>
    <script>
      function clickhandle(color) {
        return function () {
          document.body.style.backgroundColor = `${color}`;
        };
      }
      document.getElementById("orange").onclick = clickhandle("orange");
      document.getElementById("green").onclick = clickhandle("green");

      //Question 2 -Create a function that prints numbers from 1 to 5 with 1-second delay

      function fn() {
        for (var i = 1; i <= 5; i++) {
          (function (x) {
            setTimeout(() => {
              console.log(x);
            }, x * 1000);
          })(i);
        }
      }
      fn();

      //  Question 3 -Create a function that returns another function which prints "Hello".

      function outer() {
        let a = "Hello";
        function inner() {
          console.log(a);
        }
        inner();
      }
      outer();

      //  Question 4 - Create a function greet(name) that returns another function which prints the name.

      function greet(name) {
        return function () {
          console.log(name);
        };
      }
      greet("Ritik")();
    </script>
  </body>
</html>
